name: Candidate CI

on:
  push:
    branches:
      - candidate

permissions:
  contents: read

concurrency:
  group: itweb-candidate-ci
  cancel-in-progress: false

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify required source paths
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -d src/app

      - name: Reject clearly forbidden tracked files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          blocked_globs = [
              ".env",
              ".env.*",
              "*.pem",
              "*.key",
              "*.p12",
              "*.pfx",
              "id_rsa",
              "id_rsa.*",
              "id_ed25519",
              "id_ed25519.*",
          ]
          blocked_prefixes = (
              "_migration_backup/",
              "migration-backups/",
              "supabase/",
          )

          proc = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              stdout=subprocess.PIPE,
          )
          files = [item for item in proc.stdout.decode("utf-8").split("\0") if item]
          violations = []
          for rel in files:
              path = pathlib.PurePosixPath(rel)
              if any(rel == prefix[:-1] or rel.startswith(prefix) for prefix in blocked_prefixes):
                  violations.append(rel)
                  continue
              for pattern in blocked_globs:
                  if path.match(pattern) or any(pathlib.PurePosixPath(part).match(pattern) for part in path.parts):
                      violations.append(rel)
                      break
          if violations:
              print("Forbidden tracked files detected:")
              for item in violations:
                  print(item)
              sys.exit(1)
          PY

      - name: Build source archive in runner temp
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/candidate-next.tar.gz"
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=.next \
            --exclude=node_modules \
            --exclude=.vercel \
            --exclude=out \
            --exclude=build \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='*.p12' \
            --exclude='*.pfx' \
            --exclude='id_rsa' \
            --exclude='id_rsa.*' \
            --exclude='id_ed25519' \
            --exclude='id_ed25519.*' \
            --exclude='*.bak' \
            --exclude='*.backup' \
            --exclude='*.dump' \
            --exclude='*.log' \
            --exclude='*.pid' \
            --exclude='*.pid.*' \
            --exclude='*.tsbuildinfo' \
            --exclude='_migration_backup' \
            --exclude='migration-backups' \
            --exclude='supabase' \
            -czf "${archive_path}" \
            -C "${GITHUB_WORKSPACE}" .
          test -s "${archive_path}"
